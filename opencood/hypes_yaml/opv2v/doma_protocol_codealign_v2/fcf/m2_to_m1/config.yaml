name: CodeAlign_opv2v_fcf_m2_to_m1
seed: 303
root_dir: dataset/OPV2V/train
validate_dir: dataset/OPV2V/validate
test_dir: dataset/OPV2V/test
yaml_parser: load_general_params
train_params:
  batch_size: 1
  epoches: 30
  eval_freq: 2
  save_freq: 5
  max_cav: 5
comm_range: 70
input_source:
- camera
- depth
label_type: camera
cav_lidar_range:
- -102.4
- -51.2
- -3
- 102.4
- 51.2
- 1
add_data_extension:
- bev_visibility.png
heter:
  assignment_path: opencood/modality_assign/opv2v_4modality.json
  ego_modality:
  - m2
  heter_group:
  - - m2
  mapping_dict:
    m1: m2
    m2: m2
    m3: m2
    m4: m2
  lidar_channels_dict:
    m3: 32
  modality_setting:
    m2:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf:
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf:
        resize_lim:
        - 0.65
        - 0.7
        final_dim:
        - 384
        - 512
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
fusion:
  core_method: intermediateheter
  dataset: opv2v
  args:
    proj_first: false
    grid_conf: null
    data_aug_conf: null
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range:
  - -102.4
  - -51.2
  - -3
  - 102.4
  - 51.2
  - 1
postprocess:
  core_method: VoxelPostprocessor
  gt_range:
  - -102.4
  - -51.2
  - -3
  - 102.4
  - 51.2
  - 1
  anchor_args:
    cav_lidar_range:
    - -102.4
    - -51.2
    - -3
    - 102.4
    - 51.2
    - 1
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id001
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args: &id003
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id001
  cav_lidar_range:
  - -102.4
  - -51.2
  - -3
  - 102.4
  - 51.2
  - 1
  voxel_size:
  - 0.4
  - 0.4
  - 4
model:
  core_method: codealign_doma_protocol
  args:
    stage: fcf/m2_to_m1
    dataset: opv2v
    modalities:
      m2:
        core_method: lift_splat_shoot
        sensor_type: camera
        encoder_args:
          anchor_number: 2
          grid_conf: &id002
            xbound:
            - -51.2
            - 51.2
            - 0.4
            ybound:
            - -51.2
            - 51.2
            - 0.4
            zbound:
            - -10
            - 10
            - 20.0
            ddiscr:
            - 2
            - 50
            - 48
            mode: LID
          data_aug_conf:
            resize_lim:
            - 0.65
            - 0.7
            final_dim:
            - 384
            - 512
            rot_lim:
            - -3.6
            - 3.6
            H: 600
            W: 800
            rand_flip: false
            bot_pct_lim:
            - 0.0
            - 0.05
            cams:
            - camera0
            - camera1
            - camera2
            - camera3
            Ncams: 4
          img_downsample: 8
          img_features: 128
          use_depth_gt: false
          depth_supervision: true
          camera_encoder: EfficientNet
        camera_mask_args:
          cav_lidar_range:
          - -51.2
          - -51.2
          - -3
          - 51.2
          - 51.2
          - 1
          grid_conf: *id002
        backbone_args:
          layer_nums:
          - 3
          layer_strides:
          - 2
          num_filters:
          - 64
          inplanes: 128
    channels: 64
    lidar_range:
    - -102.4
    - -51.2
    - -3
    - 102.4
    - 51.2
    - 1
    feature_resolution: 0.8
    anchor_number: 2
    dir_args: *id003
    in_head: 256
    supervise_single: false
    fusion:
      method: pyramidfusion
      backbone:
        resnext: true
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 1
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        upsample_strides:
        - 1
        - 2
        - 4
        num_upsample_filter:
        - 128
        - 128
        - 128
        anchor_number: 2
      shrink_head:
        kernal_size:
        - 3
        stride:
        - 1
        padding:
        - 1
        dim:
        - 256
        input_dim: 384
    aligner:
      core_method: resnet3x3
      args:
        dim: 64
        num_of_blocks: 4
    codebook:
      seg_num: 1
      dict_size: 16
      r: 1
    translator:
      core_method: convnext
      args:
        in_channels: 64
        out_channels: 16
        in_cav_lidar_range:
        - -102.4
        - -51.2
        - -3
        - 102.4
        - 51.2
        - 1
        out_cav_lidar_range:
        - -102.4
        - -51.2
        - -3
        - 102.4
        - 51.2
        - 1
        in_feature_shape:
        - 128
        - 256
        out_feature_shape:
        - 128
        - 256
        submodule_args:
          num_of_blocks: 3
          dim: 64
          modality_map:
          - m1
loss:
  core_method: point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 20
loader:
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: false
reproducibility:
  deterministic_algorithms: false
  cudnn_deterministic: true
  cudnn_benchmark: false
codealign_protocol:
  dataset: opv2v
  stage: fcf/m2_to_m1
  source: m2
  target: m1
  seed: 303
  scene_partition: assignment_insertion_index_mod4
  camera_excluded_scenes: []
  evaluation_assignment: opencood/modality_assign/opv2v_4modality_in_order.json
  budget_source: opencood/hypes_yaml/opv2v/Heter_group/codebook/codebook_pyramid_c2c.yaml
  reference_sensor_source: docs/protocol_sources/opv2v/m2.yaml
