    budget_source: opencood/hypes_yaml/opv2v/Heter_group/codebook/codebook_pyramid_c2c.yaml
  fcf/m4_to_m1:
    config: fcf/m4_to_m1/config.yaml
    parents:
    - code_space/m4
    - code_space/m1
    checkpoint: fcf/m4_to_m1/best.pth
    budget_source: opencood/hypes_yaml/opv2v/Heter_group/codebook/codebook_pyramid_c2c.yaml
  final_infer:
    config: final_infer/config.yaml
    parents:
    - code_space/m1
    - code_space/m2
    - code_space/m3
    - code_space/m4
    - fcf/m2_to_m1
    - fcf/m3_to_m1
    - fcf/m4_to_m1
    checkpoint: final_infer/best.pth
    budget_source: opencood/hypes_yaml/opv2v/Heter_group/codebook/pyramid.yaml
checkpoint_policy: unique best validation loss; complete state latest.pth for resume
