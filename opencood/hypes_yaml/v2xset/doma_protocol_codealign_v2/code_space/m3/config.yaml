name: CodeAlign_v2xset_code_space_m3
seed: 303
root_dir: dataset/V2XSET/train
validate_dir: dataset/V2XSET/validate
test_dir: dataset/V2XSET/test
yaml_parser: load_general_params
train_params:
  batch_size: 1
  epoches: 50
  eval_freq: 2
  save_freq: 10
  max_cav: 5
comm_range: 70
input_source:
- lidar
label_type: lidar
cav_lidar_range:
- -96
- -48
- -3
- 96
- 48
- 1
add_data_extension: []
heter:
  assignment_path: opencood/modality_assign/v2xset_4modality.json
  ego_modality:
  - m3
  heter_group:
  - - m3
  mapping_dict:
    m1: m3
    m2: m3
    m3: m3
    m4: m3
  lidar_channels_dict: {}
  modality_setting:
    m3:
      sensor_type: lidar
      core_method: second
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size:
          - 0.1
          - 0.1
          - 0.1
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range:
        - -96
        - -48
        - -3
        - 96
        - 48
        - 1
fusion:
  core_method: intermediateheter
  dataset: v2xset
  args:
    proj_first: false
    grid_conf: null
    data_aug_conf: null
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range:
  - -96
  - -48
  - -3
  - 96
  - 48
  - 1
postprocess:
  core_method: VoxelPostprocessor
  gt_range:
  - -96
  - -48
  - -3
  - 96
  - 48
  - 1
  anchor_args:
    cav_lidar_range:
    - -96
    - -48
    - -3
    - 96
    - 48
    - 1
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id001
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args: &id002
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id001
  cav_lidar_range:
  - -96
  - -48
  - -3
  - 96
  - 48
  - 1
  voxel_size:
  - 0.4
  - 0.4
  - 4
model:
  core_method: codealign_doma_protocol
  args:
    stage: code_space/m3
    dataset: v2xset
    modalities:
      m3:
        core_method: second
        sensor_type: lidar
        encoder_args:
          voxel_size:
          - 0.1
          - 0.1
          - 0.1
          lidar_range:
          - -96
          - -48
          - -3
          - 96
          - 48
          - 1
          mean_vfe:
            num_point_features: 4
          spconv:
            num_features_in: 4
            num_features_out: 64
          map2bev:
            feature_num: 128
        backbone_args:
          layer_nums:
          - 3
          layer_strides:
          - 1
          num_filters:
          - 64
          inplanes: 128
    channels: 64
    lidar_range:
    - -96
    - -48
    - -3
    - 96
    - 48
    - 1
    feature_resolution: 0.8
    anchor_number: 2
    dir_args: *id002
    in_head: 256
    supervise_single: false
    fusion:
      method: pyramidfusion
      backbone:
        resnext: true
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 1
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        upsample_strides:
        - 1
        - 2
        - 4
        num_upsample_filter:
        - 128
        - 128
        - 128
        anchor_number: 2
      shrink_head:
        kernal_size:
        - 3
        stride:
        - 1
        padding:
        - 1
        dim:
        - 256
        input_dim: 384
    aligner:
      core_method: resnet3x3
      args:
        dim: 64
        num_of_blocks: 4
    codebook:
      seg_num: 1
      dict_size: 16
      r: 1
    translator:
      core_method: convnext
      args:
        in_channels: 64
        out_channels: 16
        in_cav_lidar_range:
        - -96
        - -48
        - -3
        - 96
        - 48
        - 1
        out_cav_lidar_range:
        - -96
        - -48
        - -3
        - 96
        - 48
        - 1
        in_feature_shape:
        - 120
        - 240
        out_feature_shape:
        - 120
        - 240
        submodule_args:
          num_of_blocks: 3
          dim: 64
          modality_map:
          - m1
loss:
  core_method: point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
    depth:
      weight: 1.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 30
loader:
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: false
reproducibility:
  deterministic_algorithms: false
  cudnn_deterministic: true
  cudnn_benchmark: false
codealign_protocol:
  dataset: v2xset
  stage: code_space/m3
  source: m3
  target: m1
  seed: 303
  scene_partition: assignment_insertion_index_mod4
  camera_excluded_scenes:
  - '2021_09_09_13_20_58'
  evaluation_assignment: opencood/modality_assign/v2xset_4modality_in_order.json
  budget_source: opencood/hypes_yaml/opv2v/Heter_group/codebook/codebook_pyramid_fixenc_aligner.yaml
  reference_sensor_source: docs/protocol_sources/v2xset/m3.yaml
